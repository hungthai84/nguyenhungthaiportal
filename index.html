    <!-- Google Fonts: Play (Primary System Font) & Italianno (Decorative Quote/Signature) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Play:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var cardStyle = localStorage.getItem('hungthai_card_style');
          var validStyles = ['frosted-glass', 'glassmorphism', 'mica-fluent', 'pastel-bento', 'glassmorphism-neon', 'cowhide-leather', 'glossy-glass'];
          if (cardStyle && validStyles.indexOf(cardStyle) !== -1) {
            document.documentElement.setAttribute('data-card-style', cardStyle);
          } else {
            cardStyle = 'glassmorphism';
            document.documentElement.setAttribute('data-card-style', cardStyle);
            localStorage.setItem('hungthai_card_style', cardStyle);
          }
          var isDarkInit = cardStyle === 'glassmorphism-neon' || cardStyle === 'cowhide-leather';
          if (isDarkInit) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', cardStyle === 'cowhide-leather' ? 'cowhide-leather' : 'dark-neon');
            document.documentElement.setAttribute('data-theme-mode', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.setAttribute('data-theme-mode', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-screen w-screen overflow-hidden flex flex-col justify-between m-0 p-0 selection:bg-indigo-500 selection:text-white bg-[#F8FAFC] dark:bg-[#0B1220] text-[#334155] dark:text-[#E2E8F0]">
    <div id="root" class="w-full h-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
