  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="Nguyễn Hùng Thái" />
    <meta property="og:description" content="Executive Portfolio & Contact Hub – Nguyễn Hùng Thái – Trưởng phòng Chăm sóc Khách hàng (Head of Customer Service & CX Operations). 20+ năm kinh nghiệm quản trị vận hành Contact Center & FinTech." />
    <meta property="og:image" content="https://res.cloudinary.com/q5tpzaxk/image/upload/w_128,h_128,c_fill,g_face,r_max/v1793550449/Avata_H%C3%B9ng_Th%C3%A1i.png" />
    <meta property="og:type" content="website" />

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Play (Primary System Font), Italianno & Moon Dance (Decorative Quote/Signature) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Moon+Dance&family=Play:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var DEFAULT_THEME = 'ice-blue-neu';
          var MIGRATION_KEY = 'hungthai_default_theme_v3';
          var rawStyle = localStorage.getItem('hungthai_card_style');
          var isManual = localStorage.getItem('hungthai_card_style_manual') === '1';
          var aliasMap = {
            'light-glassmorphism': 'ice-blue-neu',
            'guong-da-sac': 'rainbow-glass',
            'guong-da-sac-sang': 'rainbow-glass',
            'guong-don-sac': 'rainbow-glass',
            'guong-da-sac-toi': 'dark-rainbow-glass',
            'light-multicolor-glass': 'rainbow-glass',
            'light-multicolor-glass-dark': 'dark-rainbow-glass',
            'light-multicolor-glass-color': 'special-rainbow-glass',
            'da-thuoc': 'light-cowhide-leather',
            'da-ca-sau-trang': 'light-cowhide-leather',
            'da-den': 'black-cowhide-leather',
            'da-bo': 'cowhide-leather',
            'iceblueneu': 'ice-blue-neu',
            'darkiceblueneu': 'dark-ice-blue-neu'
          };
          var validStyles = [
            'light-cowhide-leather',
            'black-cowhide-leather',
            'cowhide-leather',
            'ice-blue-neu',
            'dark-ice-blue-neu',
            'glass-flat',
            'rainbow-glass',
            'dark-rainbow-glass',
            'special-rainbow-glass',
            'deep-ocean',
            'mica-fluent'
          ];
          var cardStyle = rawStyle && aliasMap[rawStyle] ? aliasMap[rawStyle] : rawStyle;
          if (!cardStyle || validStyles.indexOf(cardStyle) === -1) {
            cardStyle = DEFAULT_THEME;
          }
          if (localStorage.getItem(MIGRATION_KEY) !== DEFAULT_THEME) {
            if (!isManual && !rawStyle) {
              cardStyle = DEFAULT_THEME;
            }
            localStorage.setItem(MIGRATION_KEY, DEFAULT_THEME);
          }
          document.documentElement.setAttribute('data-card-style', cardStyle);
          var mechanism = (cardStyle === 'cowhide-leather' || cardStyle === 'special-rainbow-glass')
            ? 'color'
            : (cardStyle === 'black-cowhide-leather' || cardStyle === 'dark-ice-blue-neu' || cardStyle === 'dark-rainbow-glass' || cardStyle === 'deep-ocean')
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme-mechanism', mechanism);
          if (rawStyle !== cardStyle) {
            localStorage.setItem('hungthai_card_style', cardStyle);
          }
          var darkThemes = [
            'black-cowhide-leather',
            'cowhide-leather',
            'dark-ice-blue-neu',
            'dark-rainbow-glass',
            'special-rainbow-glass',
            'deep-ocean'
          ];
          var isDarkInit = darkThemes.indexOf(cardStyle) !== -1;
          if (isDarkInit) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', cardStyle);
            document.documentElement.setAttribute('data-theme-mode', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', cardStyle);
            document.documentElement.setAttribute('data-theme-mode', 'light');
          }
          var savedDepth = localStorage.getItem('hungthai_surface_depth_v1');
          var savedLayerRaw = localStorage.getItem('hungthai_layer_depth_v1');
          var savedLayer = savedLayerRaw !== null ? Number(savedLayerRaw) : NaN;
          var resolvedSurface = (savedDepth === 'flat' || savedLayer === 0) ? 'flat' : 'depth';
          document.documentElement.setAttribute('data-surface-depth', resolvedSurface);
          if (!isNaN(savedLayer) && isFinite(savedLayer)) {
            document.documentElement.setAttribute('data-layer-depth', String(Math.max(0, Math.min(200, Math.round(savedLayer)))));
          }
          localStorage.removeItem('hungthai_font_scale_v1');
          document.documentElement.removeAttribute('data-font-scale');
          document.documentElement.style.setProperty('--font-scale', '1');
          document.documentElement.style.zoom = '';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-screen w-screen overflow-hidden flex flex-col justify-between m-0 p-0 selection:bg-indigo-500 selection:text-white bg-[#F8FAFC] dark:bg-[#0B1220] text-[#334155] dark:text-[#E2E8F0]">
    <div id="root" class="w-full h-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
